<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#111827"/>
  <!-- Belt system -->
  <circle cx="200" cy="200" r="70" fill="#374151" stroke="#4b5563" stroke-width="4"/>
  <circle cx="200" cy="200" r="25" fill="#1f2937"/>
  <circle cx="420" cy="200" r="50" fill="#374151" stroke="#4b5563" stroke-width="4"/>
  <circle cx="420" cy="200" r="18" fill="#1f2937"/>
  <!-- Vanbelt -->
  <path d="M 200 130 L 420 150 A 50 50 0 0 1 420 250 L 200 270 A 70 70 0 0 1 200 130" stroke="#f59e0b" stroke-width="12" fill="none" stroke-dasharray="16, 6"/>
  <!-- Cracks indicated on belt -->
  <circle cx="310" cy="140" r="12" fill="none" stroke="#ef4444" stroke-width="3"/>
  <!-- Inspection watermark badge -->
  <rect x="20" y="20" width="220" height="32" rx="6" fill="#f59e0b" opacity="0.95"/>
  <text x="30" y="41" fill="#000000" font-family="system-ui, sans-serif" font-size="12" font-weight="700">INSPEKSI FISIK CVT & BELT</text>
  <text x="330" y="145" fill="#f87171" font-family="sans-serif" font-size="12">Retak halus</text>
</svg>
