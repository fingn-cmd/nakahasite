<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#090d16"/>
  <!-- Motherboard Base -->
  <rect x="100" y="60" width="400" height="280" rx="10" fill="#064e3b" stroke="#047857" stroke-width="3"/>
  <!-- Heatsink Fan Area -->
  <circle cx="220" cy="180" r="60" fill="#1e293b" stroke="#64748b" stroke-width="4"/>
  <circle cx="220" cy="180" r="15" fill="#475569"/>
  <!-- Copper heatpipe -->
  <path d="M 220 180 L 380 180 L 380 240" stroke="#d97706" stroke-width="12" stroke-linecap="round" fill="none"/>
  <!-- Chipset -->
  <rect x="350" y="210" width="60" height="60" rx="4" fill="#0f172a" stroke="#cbd5e1" stroke-width="2"/>
  <text x="360" y="245" fill="#f59e0b" font-family="monospace" font-size="11" font-weight="bold">GPU</text>
  <!-- Inspection watermark badge -->
  <rect x="20" y="20" width="220" height="32" rx="6" fill="#d97706" opacity="0.95"/>
  <text x="30" y="41" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">THERMAL & DUST INSPECTION</text>
</svg>
