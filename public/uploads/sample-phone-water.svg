<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#0f172a"/>
  <!-- Phone outline -->
  <rect x="180" y="50" width="240" height="300" rx="20" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  <!-- Screen with corrosion and water drops -->
  <rect x="195" y="65" width="210" height="270" rx="12" fill="#0369a1" opacity="0.3"/>
  <path d="M 220 120 Q 250 80, 280 140 T 350 160" stroke="#0ea5e9" stroke-width="6" fill="none" opacity="0.7"/>
  <circle cx="280" cy="200" r="25" fill="#e11d48" opacity="0.8"/>
  <text x="260" y="205" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">SHORT</text>
  <!-- Inspection watermark badge -->
  <rect x="20" y="20" width="230" height="32" rx="6" fill="#dc2626" opacity="0.95"/>
  <text x="30" y="41" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">KOROSI / KERUSAKAN CAIRAN</text>
