<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#0f172a"/>
  <!-- Laptop bottom case -->
  <rect x="80" y="80" width="440" height="260" rx="14" fill="#334155" stroke="#64748b" stroke-width="3"/>
  <!-- Keyboard area -->
  <rect x="120" y="100" width="360" height="150" rx="8" fill="#1e293b"/>
  <!-- Key rows -->
  <rect x="135" y="115" width="330" height="18" rx="3" fill="#0f172a"/>
  <rect x="135" y="140" width="330" height="18" rx="3" fill="#0f172a"/>
  <rect x="135" y="165" width="330" height="18" rx="3" fill="#0f172a"/>
  <!-- Spacebar sticky spill zone -->
  <rect x="220" y="195" width="160" height="22" rx="4" fill="#78350f" stroke="#f59e0b" stroke-width="2"/>
  <!-- Trackpad -->
  <rect x="230" y="260" width="140" height="70" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <!-- Inspection watermark badge -->
  <rect x="20" y="20" width="230" height="32" rx="6" fill="#b45309" opacity="0.95"/>
  <text x="30" y="41" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">TUMPAHAN CAIRAN / STICKY KEY</text>
</svg>
