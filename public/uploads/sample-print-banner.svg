<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#0f172a"/>
  <!-- Banner sample preview -->
  <rect x="80" y="80" width="440" height="240" rx="8" fill="#1e3a8a" stroke="#3b82f6" stroke-width="3"/>
  <!-- Eyelets (mata ayam) -->
  <circle cx="100" cy="100" r="10" fill="#94a3b8" stroke="#ffffff" stroke-width="2"/>
  <circle cx="500" cy="100" r="10" fill="#94a3b8" stroke="#ffffff" stroke-width="2"/>
  <circle cx="100" cy="300" r="10" fill="#94a3b8" stroke="#ffffff" stroke-width="2"/>
  <circle cx="500" cy="300" r="10" fill="#94a3b8" stroke="#ffffff" stroke-width="2"/>
  <!-- Banner artwork text -->
  <text x="300" y="180" text-anchor="middle" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="28" font-weight="900">GRAND OPENING</text>
  <text x="300" y="220" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16">FLEXI 380GSM PROOFING OK</text>
  <!-- Inspection watermark badge -->
  <rect x="20" y="20" width="220" height="32" rx="6" fill="#2563eb" opacity="0.95"/>
  <text x="30" y="41" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">FILE PROOF & FINISHING QC</text>
</svg>
